<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImagePlayer</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="stage">
  <!-- Ambient backdrop: the current photo, blown up and blurred, fading on a
       slower curve than the photo itself. -->
  <div class="backdrop" data-slot="0"></div>
  <div class="backdrop" data-slot="1"></div>

  <!-- The photo, always whole and uncropped. -->
  <div class="photo-layer" data-slot="0"><img class="photo" alt=""></div>
  <div class="photo-layer" data-slot="1"><img class="photo" alt=""></div>

  <div id="vignette"></div>
</div>

<!-- Generated by tools/build-manifest.mjs. Plain JS rather than JSON so the
     page runs straight off the filesystem with no server and no network. -->
<script src="photos.js"></script>
<script src="assets/player.js"></script>

</body>
</html>
