# Keeps photos.js in step with the photos/ folder.
#
# The playlist is a generated file, and regenerating it means running node —
# which you cannot do when you add photos by dragging them onto github.com.
# That is the way photos actually get added here, so this runs the generator
# for you and commits the result.
#
# No loop risk: this job commits photos.js, and the trigger below only fires on
# changes under photos/.

name: Rebuild photo manifest

on:
  push:
    paths:
      - 'photos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild photos.js
        run: node tools/build-manifest.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet -- photos.js; then
            echo "photos.js already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.js
          git commit -m "Rebuild photo manifest"
          git push origin HEAD:"${GITHUB_REF_NAME}"
